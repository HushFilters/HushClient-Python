services:
  hushfilter-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Set HUSHFILTER_TEST_MODE=1 to enable test mode (uses test_manifest.json)
      # - HUSHFILTER_TEST_MODE=${HUSHFILTER_TEST_MODE:-0}
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount filters directory for live updates
      - ./filters:/app/filters:rw
      - ./manifest.json:/app/manifest.json:rw
      - ./test_manifest.json:/app/test_manifest.json:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; response = requests.get('http://localhost:8000/health'); response.raise_for_status()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
