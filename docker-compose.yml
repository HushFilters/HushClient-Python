services:
  tls-cert-init:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command:
      [
        "python",
        "scripts/ensure_tls_certs.py",
        "--tls-dir",
        "/app/tls",
      ]
    volumes:
      - ./tls:/app/tls:rw
    restart: "no"

  hushfilter-api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      tls-cert-init:
        condition: service_completed_successfully
    env_file:
      - .env
    expose:
      - "8443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Set HUSHFILTER_TEST_MODE=1 to enable test mode (uses test_manifest.json)
      # - HUSHFILTER_TEST_MODE=${HUSHFILTER_TEST_MODE:-0}
      - PYTHONUNBUFFERED=1
    volumes:
      # Mount filters directory for live updates
      - ./filters:/app/filters:rw
      - ./manifest.json:/app/manifest.json:rw
      - ./test_manifest.json:/app/test_manifest.json:ro
      - ./tls:/app/tls:ro
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; response = requests.get('https://localhost:8443/health', cert=('/app/tls/internal/nginx-client.crt', '/app/tls/internal/nginx-client.key'), verify='/app/tls/internal/ca.crt'); response.raise_for_status()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      tls-cert-init:
        condition: service_completed_successfully
      hushfilter-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/hushfilter.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls:/etc/hushfilter/tls:ro
    restart: unless-stopped
